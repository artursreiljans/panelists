framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true
    cache:

    default_locale: en
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: [en]

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    php_errors:
        log: true

    csrf_protection: true
    form:
        csrf_protection:
            enabled: true

    router:
        utf8: true

    assets:
        base_path: '/assets'

    validation:
        email_validation_mode: html5

